<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMG Thakar Adarsh Highschool Kadi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8f1ff);color:#172033}
header{background:linear-gradient(135deg,#174ea6,#673ab7);color:#fff;text-align:center;padding:22px;box-shadow:0 5px 20px #0002}
header h1{margin:0;font-size:24px}header p{margin:7px 0 0}
.wrap{max-width:780px;margin:22px auto;padding:0 14px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 12px 40px #16345c18}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}
select,input{width:100%;padding:12px;border:1px solid #d6dce8;border-radius:12px;background:#fff;font-size:16px;outline:none}
select:focus,input:focus{border-color:#526dfe;box-shadow:0 0 0 3px #526dfe18}
select option.done{background:#d9f7df;color:#087443;font-weight:700}
.title{font-size:18px;font-weight:900;margin:22px 0 8px}
.hint{font-size:13px;color:#667085;margin-bottom:14px}
.roll-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.roll-box{text-align:center;font-size:18px;font-weight:800;padding:11px 4px}
.actions{display:flex;gap:10px;align-items:center;margin-top:14px}
.add{border:0;border-radius:12px;padding:10px 16px;background:#e9f1ff;color:#174ea6;font-weight:800;cursor:pointer}
.count,.status{font-size:13px;color:#667085}
.submit{width:100%;margin-top:22px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#00a86b,#10aee8);color:#fff;font-size:17px;font-weight:900;cursor:pointer}
.submit:disabled{opacity:.65;cursor:not-allowed}.view-only{background:#f2f4f7!important;color:#667085!important}.view-note{display:none;margin-top:12px;padding:11px 13px;border-radius:10px;background:#eefbf2;color:#087443;font-size:13px;font-weight:700}
.msg{display:none;margin-top:16px;padding:14px;border-radius:12px;font-weight:700;line-height:1.5}
.success{display:block;background:#e8fff3;color:#087443;border:1px solid #b7efd2}
.error{display:block;background:#fff0f0;color:#b42318;border:1px solid #f1b4b4}
#loader{position:fixed;z-index:99;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column}
.spinner{width:50px;height:50px;border:5px solid #e1e7f2;border-top-color:#315dcc;border-radius:50%;animation:spin .8s linear infinite}
.loader-text{margin-top:12px;color:#315dcc;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.roll-grid{grid-template-columns:repeat(4,1fr)}header h1{font-size:20px}}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div class="loader-text">Form તૈયાર થઈ રહ્યું છે...</div>
</div>

<header>
<h1>PMG Thakar Adarsh Highschool Kadi</h1>
<p>શાળા છોડી ગયેલ વિદ્યાર્થીઓના Roll Number</p>
</header>

<main class="wrap">
<div class="card">

<div class="grid">
<div class="field">
<label>STD</label>
<select id="std"><option value="">Select STD</option></select>
</div>
<div class="field">
<label>CLASS</label>
<select id="className" disabled><option value="">Select CLASS</option></select>
</div>
</div>

<div class="grid" style="margin-top:14px">
<div class="field">
<label>રજીસ્ટર મુજબ છેલ્લો રોલ નંબર</label>
<input id="lastRoll" type="number" min="0" step="1" inputmode="numeric">
</div>
<div class="field">
<label>વર્ગમાં હાલની કુલ સંખ્યા</label>
<input id="currentTotal" type="number" min="0" step="1" inputmode="numeric">
</div>
</div>

<div class="title">શાળા છોડી ગયેલ વિદ્યાર્થીઓના Roll Number</div>
<div class="hint">દરેક box માં 2 digit Roll Number લખો. વધુ માટે + button દબાવો.</div>

<div id="rollGrid" class="roll-grid"></div>

<div class="actions">
<button type="button" class="add" id="addBtn">＋ વધુ Roll Number</button>
<span id="count" class="count">15 boxes</span>
</div>

<button type="button" class="submit" id="submitBtn">SUBMIT DETAILS</button>
<div id="msg" class="msg"></div>
<div id="status" class="status"></div>

</div>
</main>

<script>
var API_URL="https://script.google.com/macros/s/AKfycbz_xJTpTQlumr3EsaC9he5aTYmC_Punw9uC11-PP4MLjOVIz25r4qgCSkTR6wGAMuaH/exec";

var DEFAULT_MASTER={
"9":["A","B","C","D","E","F","G","H"],
"10":["A","B","C","D","E","F","G","H"],
"11 Sci":["A","B"],
"11 Gen":["A","B","C","D"],
"12 Sci":["A","B"],
"12 Gen":["A","B","C","D"]
};

var master=DEFAULT_MASTER;

function $(id){return document.getElementById(id);}

function showMsg(text,type){
  $("msg").className="msg "+type;
  $("msg").textContent=text;
  $("msg").style.display="block";
}

function hideMsg(){
  $("msg").style.display="none";
}

function loadCache(){}
function saveCache(){}
function fillStd(){
  var el=$("std");
  el.innerHTML='<option value="">Select STD</option>';

  for(var s in master){
    if(!master.hasOwnProperty(s)) continue;

    var option=document.createElement("option");
    option.value=s;
    option.textContent=s;

    var done=false;
    var list=master[s]||[];

    for(var i=0;i<list.length;i++){
      if(typeof list[i]==="object" && list[i].hasEntry){
        done=true;
        break;
      }
    }

    if(done) option.className="done";

    el.appendChild(option);
  }
}

function getClassData(std,className){
  var list=master[std]||[];

  for(var i=0;i<list.length;i++){
    var name=typeof list[i]==="string" ? list[i] : list[i].className;

    if(name===className){
      return typeof list[i]==="object" ? list[i] : null;
    }
  }

  return null;
}

function fillClass(keep){
  var el=$("className");
  var std=$("std").value;

  el.innerHTML='<option value="">Select CLASS</option>';
  el.disabled=!std;

  if(!std) return;

  var list=master[std]||[];

  for(var i=0;i<list.length;i++){
    var item=list[i];
    var name=typeof item==="string" ? item : item.className;
    var done=typeof item==="object" && item.hasEntry;

    var option=document.createElement("option");
    option.value=name;
    option.textContent=done ? "✓ "+name+" (Entry Done)" : name;

    if(done) option.className="done";

    el.appendChild(option);
  }

  if(keep) el.value=keep;
}

function addBox(){
  var input=document.createElement("input");

  input.type="text";
  input.className="roll-box";
  input.maxLength=2;
  input.inputMode="numeric";

  input.addEventListener("input",function(){
    input.value=input.value.replace(/\D/g,"").slice(0,2);

    if(input.value.length===2){
      var all=document.querySelectorAll(".roll-box");
      for(var i=0;i<all.length;i++){
        if(all[i]===input && all[i+1]){
          all[i+1].focus();
          break;
        }
      }
    }
  });

  input.addEventListener("blur",function(){
    if(input.value.length===1){
      input.value="0"+input.value;
    }
  });

  $("rollGrid").appendChild(input);
}

function createBoxes(){
  $("rollGrid").innerHTML="";

  for(var i=0;i<15;i++){
    addBox();
  }

  updateCount();
}

function updateCount(){
  $("count").textContent=document.querySelectorAll(".roll-box").length+" boxes";
}

function setViewMode(viewOnly){
  var last=$("lastRoll"), total=$("currentTotal"), add=$("addBtn"), submit=$("submitBtn");
  var boxes=document.querySelectorAll(".roll-box");
  last.readOnly=viewOnly; total.readOnly=viewOnly;
  if(viewOnly){
    last.classList.add("view-only"); total.classList.add("view-only");
    add.disabled=true; add.classList.add("view-only");
    submit.disabled=true; submit.textContent="VIEW ONLY"; submit.classList.add("view-only");
    for(var i=0;i<boxes.length;i++){boxes[i].readOnly=true;boxes[i].classList.add("view-only");}
    $("viewNote").style.display="block";
  }else{
    last.classList.remove("view-only"); total.classList.remove("view-only");
    add.disabled=false; add.classList.remove("view-only");
    submit.disabled=false; submit.textContent="SUBMIT DETAILS"; submit.classList.remove("view-only");
    for(var j=0;j<boxes.length;j++){boxes[j].readOnly=false;boxes[j].classList.remove("view-only");}
    $("viewNote").style.display="none";
  }
}
function resetValues(){
  $("lastRoll").value=""; $("currentTotal").value="";
  var boxes=document.querySelectorAll(".roll-box");
  for(var i=0;i<boxes.length;i++) boxes[i].value="";
  $("status").textContent="";
  setViewMode(false);
}
function clearEntireForm(){
  $("std").value="";
  $("className").innerHTML='<option value="">Select CLASS</option>';
  $("className").disabled=true;
  $("lastRoll").value=""; $("currentTotal").value="";
  var boxes=document.querySelectorAll(".roll-box");
  for(var i=0;i<boxes.length;i++) boxes[i].value="";
  setViewMode(false);
  $("status").textContent="";
  hideMsg();
}
function loadExisting(){
  hideMsg();
  var std=$("std").value, cls=$("className").value;
  resetValues();
  if(!std || !cls) return;
  var data=getClassData(std,cls);
  if(data && data.hasEntry){
    $("lastRoll").value=data.lastRoll||"";
    $("currentTotal").value=data.currentTotal||"";
    var rolls=String(data.rolls||"").split(","), valid=[];
    for(var i=0;i<rolls.length;i++) if(rolls[i].trim()!=="") valid.push(rolls[i].trim());
    for(var j=0;j<valid.length;j++){
      while(j>=document.querySelectorAll(".roll-box").length) addBox();
      document.querySelectorAll(".roll-box")[j].value=valid[j];
    }
    updateCount();
    setViewMode(true);
    $("status").textContent="આ CLASSની અગાઉની entry માત્ર જોવા માટે બતાવવામાં આવી છે.";
  }
}
function jsonp(params){
  return new Promise(function(resolve,reject){

    var callbackName="PMG_CALLBACK_"+new Date().getTime()+"_"+Math.floor(Math.random()*100000);
    params.callback=callbackName;

    var script=document.createElement("script");
    script.src=API_URL+"?"+new URLSearchParams(params).toString();

    var timer=setTimeout(function(){
      cleanup();
      reject(new Error("Request timeout"));
    },15000);

    function cleanup(){
      clearTimeout(timer);
      script.remove();

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName]=undefined;
      }
    }

    window[callbackName]=function(data){
      cleanup();
      resolve(data);
    };

    script.onerror=function(){
      cleanup();
      reject(new Error("Network error"));
    };

    document.body.appendChild(script);
  });
}

async function refreshMaster(){
  if(API_URL.indexOf("PASTE_YOUR")!==-1) return;

  try{
    var result=await jsonp({action:"getMaster"});

    if(result && result.ok && result.master){
      var oldStd=$("std").value;
      var oldClass=$("className").value;

      master=result.master;
      saveCache();

      fillStd();
      $("std").value=oldStd;
      fillClass(oldClass);

      if(oldStd && oldClass){
        loadExisting();
      }
    }
  }catch(e){
    console.log("Master refresh skipped:",e.message);
  }
}

$("std").addEventListener("change",function(){
  fillClass("");
  resetValues();
  hideMsg();
});

$("className").addEventListener("change",function(){
  loadExisting();
});

$("addBtn").addEventListener("click",function(){
  addBox();
  updateCount();

  var boxes=document.querySelectorAll(".roll-box");
  boxes[boxes.length-1].focus();
});

$("submitBtn").addEventListener("click",async function(){

  hideMsg();

  var std=$("std").value;
  var className=$("className").value;
  var existing=getClassData(std,className);
  if(existing && existing.hasEntry){
    showMsg("આ CLASSની entry પહેલેથી save છે. તે માત્ર જોઈ શકાય છે; edit કરી શકાતી નથી.","error");
    return;
  }
  var lastRoll=$("lastRoll").value.trim();
  var currentTotal=$("currentTotal").value.trim();

  if(!std || !className){
    showMsg("પહેલા STD અને CLASS પસંદ કરો.","error");
    return;
  }

  if(lastRoll==="" || currentTotal===""){
    showMsg(
      "રજીસ્ટર મુજબ છેલ્લો Roll Number અને વર્ગમાં હાલની કુલ સંખ્યા બંને ભરો.",
      "error"
    );
    return;
  }

  var boxes=document.querySelectorAll(".roll-box");
  var rolls=[];

  for(var i=0;i<boxes.length;i++){
    var value=boxes[i].value.trim();

    if(value!==""){
      rolls.push(value);
    }
  }

  for(var j=0;j<rolls.length;j++){
    if(!/^\d{2}$/.test(rolls[j])){
      showMsg("દરેક Roll Number 2 digitમાં લખો.","error");
      return;
    }
  }

  var seen={};

  for(var k=0;k<rolls.length;k++){
    if(seen[rolls[k]]){
      showMsg("એક જ Roll Number બે વખત લખાયો છે.","error");
      return;
    }

    seen[rolls[k]]=true;
  }

  if(API_URL.indexOf("PASTE_YOUR")!==-1){
    showMsg("index.html માં Google Apps Script /exec URL નાખો.","error");
    return;
  }

  var button=$("submitBtn");
  button.disabled=true;
  button.textContent="SAVING...";

  try{
    var result=await jsonp({
      action:"submit",
      std:std,
      className:className,
      lastRoll:lastRoll,
      currentTotal:currentTotal,
      rolls:rolls.join(",")
    });

    if(!result || !result.ok){
      throw new Error(result && result.message ? result.message : "Save failed");
    }

    await refreshMaster();

    showMsg(
      "SUCCESS ✓ STD "+std+" - CLASS "+className+" ની entry successfully save થઈ ગઈ.",
      "success"
    );
    $("status").textContent="Entry save થઈ ગઈ. Form હવે નવી entry માટે તૈયાર થશે.";

    setTimeout(function(){
      clearEntireForm();
    },1200);

  }catch(e){
    showMsg("Entry save થઈ નથી: "+e.message,"error");
  }finally{
    button.disabled=false;
    button.textContent="SUBMIT DETAILS";
  }
});

fillStd();
createBoxes();

setTimeout(function(){
  $("loader").style.display="none";
  refreshMaster();
},1000);
</script>
</body>
</html>
