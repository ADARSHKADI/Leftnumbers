<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMG School - School Leaving Roll Numbers</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef7ff,#f7f0ff);
    min-height:100vh; color:#172033;
  }
  .top{
    background:linear-gradient(135deg,#1647a5,#673ab7);
    color:#fff; padding:22px 16px; text-align:center;
    box-shadow:0 4px 18px rgba(0,0,0,.15)
  }
  .top h1{margin:0;font-size:24px}
  .top p{margin:7px 0 0;opacity:.9;font-size:14px}
  .wrap{max-width:760px;margin:22px auto;padding:0 14px}
  .card{
    background:#fff;border-radius:20px;padding:22px;
    box-shadow:0 10px 35px rgba(30,55,100,.12);
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  label{font-weight:700;font-size:14px;display:block;margin-bottom:7px}
  select,input{
    width:100%;border:1px solid #d8deea;border-radius:12px;
    padding:12px 13px;font-size:16px;outline:none;background:#fff;
  }
  select:focus,input:focus{border-color:#536dfe;box-shadow:0 0 0 3px rgba(83,109,254,.12)}
  .section-title{margin:24px 0 10px;font-weight:800;font-size:17px}
  .hint{font-size:13px;color:#697386;margin-bottom:14px}
  .roll-grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:9px;
  }
  .roll-box{
    text-align:center;font-weight:700;font-size:18px;padding:11px 4px;
    letter-spacing:1px;
  }
  .actions{display:flex;gap:10px;align-items:center;margin-top:14px}
  .add{
    border:0;border-radius:12px;padding:10px 16px;font-size:15px;
    font-weight:800;background:#e8f1ff;color:#1450b8;cursor:pointer;
  }
  .count{font-size:13px;color:#667085}
  .submit{
    width:100%;margin-top:22px;border:0;border-radius:14px;
    padding:15px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#00a86b,#18b6e8);
    box-shadow:0 8px 20px rgba(0,168,107,.22);
  }
  .submit:disabled{opacity:.65;cursor:not-allowed}
  .msg{display:none;margin-top:16px;padding:14px;border-radius:12px;font-weight:700}
  .success{background:#e8fff4;color:#087443;border:1px solid #b8efd5}
  .error{background:#fff0f0;color:#b42318;border:1px solid #f3b4b4}
  #loader{
    position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:99;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
  }
  .spinner{
    width:48px;height:48px;border:5px solid #dfe6f5;border-top-color:#315dcc;
    border-radius:50%;animation:spin .8s linear infinite
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-text{margin-top:12px;font-weight:700;color:#315dcc}
  .mini{font-size:12px;color:#98a2b3;margin-top:8px}
  @media(max-width:520px){
    .grid{grid-template-columns:1fr}
    .roll-grid{grid-template-columns:repeat(4,1fr)}
    .top h1{font-size:20px}
  }
</style>
</head>
<body>
<div id="loader">
  <div class="spinner"></div>
  <div class="loader-text">Form તૈયાર થઈ રહ્યું છે...</div>
  <div class="mini">Please wait</div>
</div>

<header class="top">
  <h1>PMG Thakar Adarsh Highschool Kadi</h1>
  <p>શાળા છોડી ગયેલ વિદ્યાર્થીઓના Roll Number</p>
</header>

<main class="wrap">
  <div class="card">
    <div class="grid">
      <div>
        <label for="std">STD</label>
        <select id="std"><option value="">Select STD</option></select>
      </div>
      <div>
        <label for="className">CLASS</label>
        <select id="className" disabled><option value="">Select CLASS</option></select>
      </div>
    </div>

    <div class="section-title">શાળા છોડી ગયેલ વિદ્યાર્થીઓના Roll Number</div>
    <div class="hint">દરેક box માં 2 digit Roll Number લખો. ઉદાહરણ: 01, 05, 12. વધુ વિદ્યાર્થીઓ હોય તો + દબાવો.</div>

    <div id="rollGrid" class="roll-grid"></div>

    <div class="actions">
      <button type="button" class="add" id="addBtn">＋ વધુ Roll Number</button>
      <span class="count" id="count">15 boxes</span>
    </div>

    <button type="button" class="submit" id="submitBtn">SUBMIT DETAILS</button>

    <div id="msg" class="msg"></div>
  </div>
</main>

<script>
/*
  GitHub Pages -> Google Apps Script
  IMPORTANT: Replace API_URL with your deployed Apps Script /exec URL.
*/
const API_URL = "https://script.google.com/macros/s/AKfycbz_xJTpTQlumr3EsaC9he5aTYmC_Punw9uC11-PP4MLjOVIz25r4qgCSkTR6wGAMuaH/exec";

const DEFAULT_MASTER = {
  "9": ["A","B","C","D","E","F","G","H"],
  "10": ["A","B","C","D","E","F","G","H"],
  "11 Sci": ["A","B"],
  "11 Gen": ["A","B","C","D"],
  "12 Sci": ["A","B"],
  "12 Gen": ["A","B","C","D"]
};

let master = DEFAULT_MASTER;
let boxCount = 15;

const $ = id => document.getElementById(id);
const stdEl = $("std");
const classEl = $("className");
const rollGrid = $("rollGrid");
const msg = $("msg");

function showMessage(text, type){
  msg.className = "msg " + type;
  msg.textContent = text;
  msg.style.display = "block";
  if(type === "success") window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function hideMessage(){ msg.style.display="none"; }

function fillStd(){
  stdEl.innerHTML = '<option value="">Select STD</option>';
  Object.keys(master).forEach(s=>{
    const o=document.createElement("option");
    o.value=s; o.textContent=s;
    stdEl.appendChild(o);
  });
}

function fillClasses(){
  const s=stdEl.value;
  classEl.innerHTML='<option value="">Select CLASS</option>';
  classEl.disabled=!s;
  if(!s) return;
  (master[s]||[]).forEach(c=>{
    const o=document.createElement("option");
    o.value=c; o.textContent=c;
    classEl.appendChild(o);
  });
}

function addRollBox(){
  const input=document.createElement("input");
  input.type="text";
  input.inputMode="numeric";
  input.maxLength=2;
  input.pattern="[0-9]{2}";
  input.className="roll-box";
  input.placeholder=String(boxCount+1).padStart(2,"0");
  input.setAttribute("aria-label","Roll Number");
  input.addEventListener("input",()=>{
    input.value=input.value.replace(/\D/g,"").slice(0,2);
    if(input.value.length===2){
      const all=[...document.querySelectorAll(".roll-box")];
      const i=all.indexOf(input);
      if(all[i+1]) all[i+1].focus();
    }
  });
  input.addEventListener("blur",()=>{
    if(input.value.length===1) input.value=input.value.padStart(2,"0");
  });
  rollGrid.appendChild(input);
}

function createInitialBoxes(){
  rollGrid.innerHTML="";
  for(let i=0;i<15;i++) addRollBox();
  updateCount();
}
function updateCount(){
  $("count").textContent=`${document.querySelectorAll(".roll-box").length} boxes`;
}

stdEl.addEventListener("change",()=>{ fillClasses(); hideMessage(); });
classEl.addEventListener("change",hideMessage);

$("addBtn").addEventListener("click",()=>{
  addRollBox(); updateCount();
  [...document.querySelectorAll(".roll-box")].at(-1).focus();
});

function loadCachedMaster(){
  try{
    const saved=JSON.parse(localStorage.getItem("pmg_roll_master")||"null");
    if(saved && saved.master) master=saved.master;
  }catch(e){}
}

function saveMaster(data){
  try{
    localStorage.setItem("pmg_roll_master",JSON.stringify({master:data.master, savedAt:Date.now()}));
  }catch(e){}
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    params.callback=cb;
    const script=document.createElement("script");
    const qs=new URLSearchParams(params).toString();
    const timer=setTimeout(()=>{cleanup();reject(new Error("Request timeout"));},12000);
    function cleanup(){
      clearTimeout(timer); script.remove(); delete window[cb];
    }
    window[cb]=(data)=>{cleanup();resolve(data)};
    script.src=API_URL+"?"+qs;
    script.onerror=()=>{cleanup();reject(new Error("Network error"))};
    document.body.appendChild(script);
  });
}

async function refreshMasterInBackground(){
  if(API_URL.includes("PASTE_YOUR")) return;
  try{
    const data=await jsonp({action:"getMaster"});
    if(data && data.ok && data.master){
      master=data.master;
      saveMaster(data);
      const currentStd=stdEl.value, currentClass=classEl.value;
      fillStd();
      if(master[currentStd]){
        stdEl.value=currentStd; fillClasses(); classEl.value=currentClass;
      }
    }
  }catch(e){
    console.log("Background master refresh skipped:",e.message);
  }
}

$("submitBtn").addEventListener("click",async()=>{
  hideMessage();
  const std=stdEl.value, className=classEl.value;
  if(!std || !className){
    showMessage("પહેલા STD અને CLASS પસંદ કરો.","error"); return;
  }

  const rolls=[...document.querySelectorAll(".roll-box")]
    .map(x=>x.value.trim())
    .filter(Boolean);

  const invalid=rolls.filter(x=>!/^\d{2}$/.test(x));
  if(invalid.length){
    showMessage("દરેક Roll Number 2 digitમાં લખો. ઉદાહરણ: 01, 05, 12.","error"); return;
  }

  const unique=[...new Set(rolls)];
  if(unique.length!==rolls.length){
    showMessage("એક જ Roll Number બે વખત ન લખો.","error"); return;
  }

  if(API_URL.includes("PASTE_YOUR")){
    showMessage("Codeમાં Google Apps Script /exec URL નાખો.","error"); return;
  }

  const btn=$("submitBtn");
  btn.disabled=true;
  btn.textContent="SUBMITTING...";

  try{
    const data=await jsonp({
      action:"submit",
      std:std,
      className:className,
      rolls:rolls.join(",")
    });
    if(data && data.ok){
      showMessage(`SUCCESS ✓ STD ${std} - CLASS ${className} ની entry successfully save થઈ ગઈ. Roll Number: ${rolls.join(", ") || "None"}`,"success");
    }else{
      throw new Error((data&&data.message)||"Submit failed");
    }
  }catch(e){
    showMessage("Entry save થઈ નથી. Internet/Apps Script URL check કરો. "+e.message,"error");
  }finally{
    btn.disabled=false;
    btn.textContent="SUBMIT DETAILS";
  }
});

(function init(){
  loadCachedMaster();
  fillStd();
  createInitialBoxes();

  // User requested an attractive first-load spinner for about 1 second.
  setTimeout(()=>{
    $("loader").style.display="none";
    refreshMasterInBackground();
  },1000);
})();
</script>
</body>
</html>
